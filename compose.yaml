services:
  api:
    image: eco-herd-api:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATA_FILE: /data/eco-herd.sqlite
      AI_ENABLED: ${AI_ENABLED:-1}
      AI_MODEL_DIR: /models
      AI_PYTHON: /opt/venv/bin/python
    volumes:
      - records:/data
      - type: bind
        source: ${MODEL_DIR:-./models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    image: eco-herd-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  records:
